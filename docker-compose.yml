services:
  agent:
    build:
      context: .
      dockerfile: agent/Dockerfile
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./agent:/app/agent
      - ./frontend:/app/frontend
    depends_on:
      - qdrant
      - sandbox
      - mcp-playwright

  # Banco vetorial usado pelo RAG (módulo 6a). Exposto também na máquina host
  # (localhost:6333) para que o agente rodando fora do container (via
  # scripts/start-agent.ps1) consiga consultá-lo durante o desenvolvimento.
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333" # API HTTP/REST
      - "6334:6334" # API gRPC
    volumes:
      - qdrant_data:/qdrant/storage

  # Sandbox de execução de código Python (módulo 6c). Sem rede, sistema de
  # arquivos somente leitura (exceto /tmp), sem capabilities e com limites de
  # CPU/memória. A tool run_python (agent/tools/sandbox.py) executa código
  # aqui via `docker exec`, nunca por rede — por isso nenhuma porta é exposta.
  sandbox:
    build:
      context: ./sandbox
    container_name: mentor-sandbox
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0

  # Servidor MCP do Playwright (módulo 6d), oficial da Microsoft. Roda headless
  # (nunca abre uma janela, dentro ou fora do container) e devolve snapshots de
  # acessibilidade estruturados ao agente. --no-sandbox desativa o sandbox
  # interno do Chromium (que exige capabilities extras) porque o próprio
  # container já é a fronteira de isolamento. A allowlist de domínios de
  # verdade fica em agent/hooks.py: o Playwright MCP não trata suas próprias
  # flags de origem como uma fronteira de segurança.
  mcp-playwright:
    image: mcr.microsoft.com/playwright/mcp:latest
    container_name: mentor-mcp-playwright
    entrypoint: node
    command:
      - "/app/cli.js"
      - "--headless"
      - "--browser=chromium"
      - "--no-sandbox"
      - "--isolated"
      - "--host=0.0.0.0"
      - "--port=8931"
    ports:
      - "8931:8931"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 1.0
    shm_size: "1gb"

volumes:
  qdrant_data:
